replicaCount: 1

image:
  repository: ghcr.io/jualvarez9/trivy-project
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

resources: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 10001
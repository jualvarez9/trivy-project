name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Run SAST with Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python

      - name: Start API for DAST
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/fastapi.log 2>&1 &
          echo $! > /tmp/fastapi.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health

      - name: Run DAST with OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000
          fail_action: false
          allow_issue_writing: false

      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/fastapi.pid)" || true

      - name: Scan Dockerfile configuration with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Build backend Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE_NAME }}-backend:${{ github.sha }} \
            --tag ${{ env.IMAGE_NAME }}-backend:latest \
            .

      - name: Build frontend Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE_NAME }}-frontend:${{ github.sha }} \
            --tag ${{ env.IMAGE_NAME }}-frontend:latest \
            front

      - name: Scan backend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push ${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}-backend:latest
          docker push ${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}-frontend:latest